[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["GilcierWeb", "GilcierWeb <gilcierweb@gmail.com>"]
license = "MIT"

[workspace.dependencies]
thiserror = "2.0.21"
clap = { version = "4", features = ["derive"] }
diesel = { version = "2.2", default-features = false }
sea-query = { version = "0.32", default-features = false, features = ["with-uuid", "backend-postgres", "backend-sqlite"] }
sqlx = { version = "0.8", default-features = false }
bson = { version = "2", default-features = false }
axum = { version = "0.8", default-features = false }
actix-web = "4"
futures = "0.3"
tower = "0.5"
rstest = "0.27"
pretty_assertions = "1.4"
libsqlite3-sys = { version = "0.28", features = ["bundled"] }
cancancan-core = { path = "crates/cancancan-core" }
cancancan-axum = { path = "crates/cancancan-axum" }
cancancan-actix = { path = "crates/cancancan-actix" }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
