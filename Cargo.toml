[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["GilcierWeb", "GilcierWeb <gilcierweb@gmail.com>"]
license = "MIT"

[workspace.dependencies]
thiserror = "2.0.21"
clap = { version = "4", features = ["derive"] }
rstest = "0.27"
pretty_assertions = "1.4"
cancancan-core = { path = "crates/cancancan-core" }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
